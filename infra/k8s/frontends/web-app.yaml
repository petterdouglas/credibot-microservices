apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: credibot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app
          image: credibot-microservices-web-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: WEB_API_URL
              valueFrom:
                configMapKeyRef:
                  name: credibot-config
                  key: WEB_API_URL
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: credibot
spec:
  selector:
    app: web-app
  ports:
    - port: 80
      targetPort: 80