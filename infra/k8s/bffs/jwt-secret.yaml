apiVersion: v1
kind: Secret
metadata:
  name: credibot-jwt
  namespace: credibot
type: Opaque
stringData:
  # Substitua pelo valor real antes de aplicar em produção.
  # Em desenvolvimento pode ser qualquer string; em produção use um valor
  # aleatório forte (ex: openssl rand -base64 32).
  JWT_SECRET: "troque-por-uma-chave-secreta-forte"
