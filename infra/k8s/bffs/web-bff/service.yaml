apiVersion: v1
kind: Service
metadata:
  name: web-bff
  namespace: credibot
  labels:
    app: web-bff
    component: bff
spec:
  # ClusterIP: acesso apenas interno (gateway → web-bff).
  # O web-bff não é exposto diretamente fora do cluster.
  type: ClusterIP
  selector:
    app: web-bff
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
