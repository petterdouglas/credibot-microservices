apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-bff
  namespace: credibot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-bff
  template:
    metadata:
      labels:
        app: web-bff
    spec:
      containers:
        - name: web-bff
          image: credibot-microservices-web-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: LOAN_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: credibot-config
                  key: LOAN_SERVICE_URL
            - name: CUSTOMER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: credibot-config
                  key: CUSTOMER_SERVICE_URL
            - name: AI_ASSISTANT_URL
              valueFrom:
                configMapKeyRef:
                  name: credibot-config
                  key: AI_ASSISTANT_URL
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: web-bff
  namespace: credibot
spec:
  selector:
    app: web-bff
  ports:
    - port: 3001
      targetPort: 3001
