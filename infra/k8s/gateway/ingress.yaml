apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credibot-ingress
  namespace: credibot
  labels:
    app: credibot
    component: ingress
  annotations:
    # Controlador NGINX Ingress (padrão em Minikube e na maioria dos clusters).
    # Trocar para "traefik" ou outro controlador conforme o ambiente.
    nginx.ingress.kubernetes.io/rewrite-target: /$2

    # Rate limiting nativo do NGINX Ingress Controller.
    # Espelha as políticas implementadas no nginx.conf do gateway.
    nginx.ingress.kubernetes.io/limit-rps: "20"

    # Encaminha o header Authorization para os BFFs.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"

    # Tamanho máximo do body (cobre uploads KYC e payloads JSON).
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # ---------------------------------------------------------------
          # /web/* → Web BFF (Service credibot/web-bff, porta 3001)
          # O rewrite-target($2) remove o prefixo /web antes de encaminhar.
          # Exemplo: GET /web/dashboard → GET /dashboard no web-bff.
          # ---------------------------------------------------------------
          - path: /web(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: web-bff
                port:
                  number: 3001

          # ---------------------------------------------------------------
          # /admin/* → Admin BFF (Service credibot/admin-bff, porta 3002)
          # Mesmo padrão de rewrite: /admin/loans/1 → /loans/1 no admin-bff.
          # ---------------------------------------------------------------
          - path: /admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: admin-bff
                port:
                  number: 3002

          # ---------------------------------------------------------------
          # /health → Gateway health check direto (sem upstream BFF).
          # Em K8s o gateway é um Deployment separado; o Ingress acessa
          # o Service do gateway para o health check externo.
          # ---------------------------------------------------------------
          - path: /health
            pathType: Exact
            backend:
              service:
                name: gateway
                port:
                  number: 8080

# ---------------------------------------------------------------------------
# Para expor via HTTPS em produção, adicionar spec.tls:
#
#   tls:
#     - hosts:
#         - api.credibot.com.br
#       secretName: credibot-tls
#
# E habilitar a anotação:
#   nginx.ingress.kubernetes.io/ssl-redirect: "true"
# ---------------------------------------------------------------------------
