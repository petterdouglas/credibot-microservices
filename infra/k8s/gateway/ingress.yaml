apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credibot-ingress
  namespace: credibot
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /web(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: web-bff
                port:
                  number: 3001
          - path: /admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: admin-bff
                port:
                  number: 3002
