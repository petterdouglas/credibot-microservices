apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credibot-frontends-ingress
  namespace: credibot
spec:
  ingressClassName: nginx
  rules:
    - host: web.credibot.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  number: 80
    - host: admin.credibot.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-panel
                port:
                  number: 80