apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-analysis-service
  namespace: credibot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credit-analysis-service
  template:
    metadata:
      labels:
        app: credit-analysis-service
    spec:
      containers:
        - name: credit-analysis-service
          image: credibot-microservices-credit-analysis-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SERVER_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: credibot-config
                  key: SERVER_ADDRESS
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: credibot-secrets
                  key: MONGODB_URI
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: credibot-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: credibot-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: credibot-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credibot-secrets
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: credit-analysis-service
  namespace: credibot
spec:
  selector:
    app: credit-analysis-service
  ports:
    - port: 8083
      targetPort: 8083
