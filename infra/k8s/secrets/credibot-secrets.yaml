apiVersion: v1
kind: Secret
metadata:
  name: credibot-secrets
  namespace: credibot
type: Opaque
stringData:
  POSTGRES_USER: "credibot_loan_user"
  POSTGRES_PASSWORD: "credibot_loan_pass"
  LOAN_DB_URL: "jdbc:postgresql://postgres:5432/credibot_loan"
  MYSQL_USER: "credibot_customer_user"
  MYSQL_PASSWORD: "credibot_customer_pass"
  MYSQL_ROOT_PASSWORD: "credibot_mysql_root"
  CUSTOMER_DB_URL: "jdbc:mysql://mysql:3306/credibot_customer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  MONGO_INITDB_ROOT_USERNAME: "credibot_mongo_user"
  MONGO_INITDB_ROOT_PASSWORD: "credibot_mongo_pass"
  MONGODB_URI: "mongodb://credibot_mongo_user:credibot_mongo_pass@mongodb:27017/credibot_credit?authSource=admin"
  RABBITMQ_USER: "credibot_mq"
  RABBITMQ_PASSWORD: "credibot_mq_pass"
  LLM_API_KEY: "changeme-your-llm-api-key"
