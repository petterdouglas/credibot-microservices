limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;

upstream web_bff {
    server web-bff:3001;
}

upstream admin_bff {
    server admin-bff:3002;
}

server {
    listen 80;
    server_name _;

    # Healthcheck do próprio Gateway
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"api-gateway"}';
    }

    # Rotas para clientes finais -> Web BFF
    location /web/ {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://web_bff/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rotas de backoffice -> Admin BFF
    location /admin/ {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://admin_bff/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
