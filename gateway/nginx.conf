# =============================================================================
# CrediBot — API Gateway (Nginx 1.27 Alpine)
# Responsabilidade: ponto único de entrada, roteamento, rate limiting.
#
# NOTA SOBRE AUTENTICAÇÃO DE BORDA:
#   Não existe auth-service nem JWT secret compartilhado no repositório atual.
#   O Nginx propaga o header Authorization para os BFFs, que são responsáveis
#   pela validação do token em suas camadas de middleware.
#   JWT Offloading no Nginx só poderá ser ativado quando um serviço de
#   autenticação e um secret/JWKS endpoint estiverem disponíveis na arquitetura.
# =============================================================================

# ---------------------------------------------------------------------------
# Rate Limiting
# Zona: 10 MB em memória (~160 000 endereços IP distintos)
# Limite padrão: 20 req/s por IP para rotas de cliente web
# Limite restrito: 10 req/s por IP para o painel administrativo
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=web_rate_limit:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=admin_rate_limit:10m rate=10r/s;

# Retorna 429 (Too Many Requests) quando o limite é excedido.
# O padrão do Nginx seria 503 — corrigido aqui.
limit_req_status 429;

# ---------------------------------------------------------------------------
# Upstreams — nomes resolvidos pela rede Docker (edge-net)
# ---------------------------------------------------------------------------
# DNS interno do Docker. Com `resolve`, o Nginx re-resolve os nomes
# periodicamente, então recriar um BFF (que troca de IP) não quebra o gateway.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream web_bff {
    zone web_bff 64k;
    server web-bff:3001 resolve;
    keepalive 32;
}

upstream admin_bff {
    zone admin_bff 64k;
    server admin-bff:3002 resolve;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Servidor principal
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Tamanho máximo de body (cobre uploads de documentos KYC e payloads JSON)
    client_max_body_size 5m;

    # Timeouts de proxy
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Headers comuns a todas as rotas de proxy
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Propaga o token para validação nos BFFs.
    # (Validação efetiva ocorre nos BFFs — ver nota de autenticação acima)
    proxy_set_header   Authorization     $http_authorization;

    # -------------------------------------------------------------------------
    # /health — Health check do próprio Gateway (sem dependência de upstream)
    # -------------------------------------------------------------------------
    location = /health {
        access_log  off;
        default_type application/json;
        return 200 '{"status":"UP","service":"api-gateway"}';
    }

    # -------------------------------------------------------------------------
    # /web/* — Rotas do cliente final → Web BFF (porta 3001)
    #
    # O proxy_pass com trailing slash remove o prefixo /web antes de
    # encaminhar: GET /web/loans → GET /loans no Web BFF.
    # -------------------------------------------------------------------------
    location /web/ {
        limit_req zone=web_rate_limit burst=30 nodelay;

        proxy_pass http://web_bff/;
    }

    # -------------------------------------------------------------------------
    # /admin/* — Rotas do painel administrativo → Admin BFF (porta 3002)
    #
    # Limite mais restritivo (backoffice tem menos usuários simultâneos).
    # -------------------------------------------------------------------------
    location /admin/ {
        limit_req zone=admin_rate_limit burst=10 nodelay;

        proxy_pass http://admin_bff/;
    }

    # -------------------------------------------------------------------------
    # Resposta de erro customizada para 429 (rate limit excedido)
    # -------------------------------------------------------------------------
    error_page 429 @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"status":"ERROR","code":429,"message":"Too Many Requests — rate limit exceeded. Try again later."}';
    }

    # -------------------------------------------------------------------------
    # Resposta de erro customizada para 502/503/504 (upstream indisponível)
    # -------------------------------------------------------------------------
    error_page 502 503 504 @upstream_error;
    location @upstream_error {
        default_type application/json;
        return 503 '{"status":"ERROR","code":503,"message":"Service temporarily unavailable. Please try again shortly."}';
    }
}
