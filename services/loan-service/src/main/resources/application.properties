# ===================================================================
# CrediBot - Loan Service Configuration (Java 21 / Spring Boot 3.4)
# ===================================================================
spring.application.name=loan-service
server.port=${SERVER_PORT:8081}
server.address=${SERVER_ADDRESS:127.0.0.1}

# Java 21 Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true

# RFC 7807 Problem Details for HTTP Error Responses
spring.mvc.problemdetails.enabled=true

# PostgreSQL Datasource (Credentials injected via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/credibot_loan}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Migrations (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ Broker (SAGA Choreography & CQRS Sync)
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Outbox Poller Configuration
credibot.outbox.polling-interval-ms=${OUTBOX_POLLING_INTERVAL_MS:1000}
credibot.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}

# Janela de revisão manual: segundos que o loan.created espera antes de ir para a análise automática
credibot.loan.auto-analysis-delay-seconds=${LOAN_AUTO_ANALYSIS_DELAY_SECONDS:300}

# Actuator Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

