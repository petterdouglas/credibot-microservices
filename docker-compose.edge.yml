# =============================================================================
# CrediBot — Override de desenvolvimento: camada de borda isolada
#
# Uso: docker compose -f docker-compose.yml -f docker-compose.edge.yml \
#        up -d gateway web-bff admin-bff
#
# Este arquivo NÃO substitui o docker-compose.yml principal.
# Ele sobrescreve apenas os depends_on dos BFFs, permitindo subir
# gateway + web-bff + admin-bff sem aguardar os microsserviços Java
# (loan-service, customer-service, credit-analysis-service, ai-assistant-service)
# que estão em desenvolvimento por outros integrantes da equipe.
#
# O docker-compose.yml principal permanece intacto para deploy completo.
# =============================================================================
services:
  web-bff:
    # Remove a dependência dos microsserviços Java para ambiente de borda.
    # Os BFFs iniciam imediatamente; erros de integração retornarão 503
    # enquanto os serviços upstream não estiverem disponíveis.
    depends_on: {}

  admin-bff:
    depends_on: {}
