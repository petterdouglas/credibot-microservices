server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker; a variavel evita falha de boot se o gateway ainda nao subiu
    resolver 127.0.0.11 valid=10s;

    # Chamadas de API -> gateway (mesma origem, sem CORS). O prefixo /web/ e mantido.
    location /web/ {
        set $gateway http://gateway:80;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota do React Router cai no index.html
    location / {
        try_files $uri /index.html;
    }
}
